<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S — Assistant EPS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--c:#00d4ff;--cd:#0099bb;--cg:rgba(0,212,255,.3);--d:#030d15;--d2:#071828;--d3:#0a2035;--t:#cce8f4;--td:#5a8fa8;--r:#ff4444;--g:#00ff88;--w:#ffaa00;--fn:'Orbitron',monospace;--fb:'Exo 2',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--d);color:var(--t);font-family:var(--fb)}
/* LOCK */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#071828 0%,#030d15 70%)}
.grid-bg{position:absolute;inset:0;background-image:repeating-linear-gradient(0deg,transparent,transparent 49px,rgba(0,212,255,.03) 50px),repeating-linear-gradient(90deg,transparent,transparent 49px,rgba(0,212,255,.03) 50px);animation:gpulse 4s ease-in-out infinite}
@keyframes gpulse{0%,100%{opacity:.5}50%{opacity:1}}
.lock-box{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:16px}
.lock-title{font-family:var(--fn);font-size:3.2rem;font-weight:900;color:var(--c);text-shadow:0 0 30px var(--c),0 0 60px var(--cd);letter-spacing:.5rem}
.lock-sub{font-family:var(--fn);font-size:.7rem;color:var(--td);letter-spacing:.3rem}
.lock-hint{color:var(--td);font-size:.9rem;margin-top:4px}
.lock-input-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:2px;width:100%}
.lock-input{background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.3);color:var(--t);font-family:var(--fb);font-size:.95rem;padding:10px 18px;border-radius:4px;outline:none;width:260px;text-align:center}
.lock-input:focus{border-color:var(--c);box-shadow:0 0 12px var(--cg)}
PLACEHOLDER
</style>
</head>
<body>
</body>
</html>
